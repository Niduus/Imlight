name: Bug report
description: Something in Imlight or Ahziael is broken or acting wrong
title: "[Bug] "
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Fill in what you can. Short answers are fine.
  - type: input
    id: version
    attributes:
      label: Imlight version
      description: Shown in the Ahziael app (the "What's new" list marks yours). For example 0.10.603.
      placeholder: 0.10.603
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - In the game (quests, battles, items, NPCs, ...)
        - In the Ahziael app
        - Installing or updating
        - Something else
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      placeholder: "Example: Malistaire's cheat didn't trigger when I cast a blade."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we make it happen again?
      description: The steps you took, in order. Include the world, zone, NPC or command if you know it.
      placeholder: |
        1. Go to ...
        2. Talk to / fight / type ...
        3. See the problem
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Screenshots or logs
      description: Drag pictures or log files into this box.
    validations:
      required: false
