# One-time clean-up (Niduus, 2026-11-26: "Delete all but the most recent" release).
# Deletes only the releases listed in tools/cleanup/old-releases.txt, in Niduus/Imlight only.
# Git tags are kept, so version numbers and the What's New history built from tags still work.
# Runs only from the claude/project-thread-6lvra6 branch, never from the main branch.
name: Delete old releases

on:
  push:
    branches: ['claude/project-thread-6lvra6']
    paths: ['tools/cleanup/old-releases.txt', '.github/workflows/delete-old-releases.yml']

permissions:
  contents: write

jobs:
  delete:
    if: github.repository == 'Niduus/Imlight'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Delete the listed releases (tags stay)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          test "$GITHUB_REPOSITORY" = "Niduus/Imlight"
          deleted=0; gone=0; failed=0
          while read -r id tag; do
            [ -z "$id" ] && continue
            [ "$tag" = "v0.10.990" ] && { echo "Skipping the kept release $tag"; continue; }
            code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Niduus/Imlight/releases/$id")
            case "$code" in
              204) deleted=$((deleted+1)) ;;
              404) gone=$((gone+1)) ;;
              *) failed=$((failed+1)); echo "Could not delete $tag ($id): $code"; sleep 60 ;;
            esac
            sleep 1
          done < tools/cleanup/old-releases.txt
          echo "Deleted $deleted, already gone $gone, failed $failed"
          [ "$failed" -eq 0 ]
