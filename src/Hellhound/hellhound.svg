<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1218"/><stop offset="1" stop-color="#0c080e"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d9200f"/><stop offset=".5" stop-color="#ff7a18"/><stop offset="1" stop-color="#ffd84d"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2027"/><stop offset="1" stop-color="#0d090c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".55" cy=".55" r=".55">
      <stop offset="0" stop-color="#ff4a12" stop-opacity=".55"/><stop offset="1" stop-color="#ff4a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7c2"/><stop offset=".45" stop-color="#ffcc33"/><stop offset="1" stop-color="#ff5a14"/>
    </radialGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="140" cy="140" r="120" fill="url(#glow)"/>
    <!-- flames behind -->
    <path fill="url(#fire)" d="M100 250 C78 214 86 182 104 160 C100 178 108 186 116 188 C108 156 122 120 146 98
      C142 120 150 132 160 136 C158 104 172 72 198 52 C192 78 200 98 212 108 C214 92 224 80 238 74
      C230 98 238 120 236 142 C246 132 250 118 252 108 C262 150 256 200 236 250 Z"/>
    <path fill="#ffd84d" opacity=".55" d="M150 250 C140 226 146 206 158 192 C158 206 164 212 170 214 C168 194 180 172 196 160
      C194 178 200 188 208 192 C210 180 218 172 226 168 C224 188 232 214 224 250 Z"/>
    <!-- neck and shoulders, spiky fur down the back -->
    <path fill="url(#fur)" d="M92 256 C96 226 104 204 118 186 L130 176 C148 170 166 160 178 146
      L190 150 L184 160 L200 162 L192 174 L210 178 L200 190 L218 196 L206 206 L224 214 L210 222 L228 232 L214 240 L230 256 Z"/>
    <!-- head -->
    <path fill="url(#fur)" d="M118 186 C106 176 100 166 98 158
      L64 160 C56 160 52 156 54 150 L60 144
      L104 136
      L54 128 C44 127 36 121 36 114 C36 108 40 104 46 103 L86 92
      C96 86 104 80 112 74
      L122 30 L138 66 L148 38 L158 74
      C172 82 184 96 188 114 C192 130 188 140 178 146 C166 160 148 170 130 176 Z"/>
    <!-- inner ears -->
    <path fill="#5a1d22" d="M124 44 L132 66 L126 70 Z"/>
    <path fill="#5a1d22" d="M148 52 L154 74 L148 76 Z"/>
    <!-- open mouth: tongue and gums -->
    <path fill="#7a1420" d="M60 144 L104 136 L98 150 C88 152 74 154 64 156 Z"/>
    <path fill="#c43a4a" d="M68 150 C78 146 90 145 98 147 L96 152 C86 154 76 155 68 155 Z"/>
    <!-- teeth -->
    <path fill="#f6eee2" d="M52 127 L58 127 L55 139 Z M64 128 L69 128 L66 136 Z M76 130 L80 130 L78 136 Z M88 131 L92 131 L90 136 Z M98 133 L102 133 L100 138 Z"/>
    <path fill="#f6eee2" d="M60 159 L65 159 L62 148 Z M74 157 L78 157 L76 151 Z M86 156 L90 156 L88 150 Z"/>
    <!-- nose -->
    <path fill="#0a0608" d="M34 108 C34 102 40 99 47 100 C52 101 54 106 52 111 C49 116 40 117 36 114 Z"/>
    <ellipse cx="42" cy="104" rx="4" ry="2" fill="#3b2a33"/>
    <!-- muzzle wrinkles and brow -->
    <g fill="none" stroke="#4a3440" stroke-width="2.5" stroke-linecap="round">
      <path d="M62 108 C70 104 78 104 84 108"/>
      <path d="M66 116 C74 112 82 112 88 116"/>
      <path d="M96 92 C104 86 114 84 124 86"/>
      <path d="M130 120 C140 126 150 128 160 126"/>
      <path d="M136 134 C146 140 156 140 166 136"/>
      <path d="M150 96 C160 100 168 108 172 118"/>
    </g>
    <!-- eye with glow -->
    <circle cx="114" cy="98" r="12" fill="#ff6a14" opacity=".35"/>
    <path fill="url(#eye)" d="M100 101 C106 93 116 90 128 92 C122 100 112 104 100 101 Z"/>
    <path fill="#2a0a06" d="M114 93 L116 93 L115 101 Z"/>
    <!-- rim light along the back of head and neck -->
    <path fill="none" stroke="#ff8a2a" stroke-width="2" stroke-linecap="round" opacity=".8"
      d="M158 74 C172 82 184 96 188 114 C192 130 188 140 178 146"/>
    <path fill="none" stroke="#ff8a2a" stroke-width="2" stroke-linecap="round" opacity=".7" d="M138 66 L148 38 L158 74"/>
  </g>
</svg>
