<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hellhound</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E %3Cdefs%3E %3ClinearGradient id='bg' x1='0' y1='0' x2='0' y2='1'%3E %3Cstop offset='0' stop-color='%232a1420'/%3E%3Cstop offset='1' stop-color='%230e0a12'/%3E %3C/linearGradient%3E %3ClinearGradient id='fire' x1='0' y1='1' x2='0' y2='0'%3E %3Cstop offset='0' stop-color='%23ff3d1f'/%3E%3Cstop offset='.55' stop-color='%23ff8a1f'/%3E%3Cstop offset='1' stop-color='%23ffd54a'/%3E %3C/linearGradient%3E %3CradialGradient id='glow' cx='.5' cy='.55' r='.5'%3E %3Cstop offset='0' stop-color='%23ff5a1f' stop-opacity='.45'/%3E%3Cstop offset='1' stop-color='%23ff5a1f' stop-opacity='0'/%3E %3C/radialGradient%3E %3C/defs%3E %3Crect x='8' y='8' width='240' height='240' rx='52' fill='url%28%23bg%29'/%3E %3Ccircle cx='128' cy='140' r='110' fill='url%28%23glow%29'/%3E %3C%21-- flame mane behind the head --%3E %3Cpath fill='url%28%23fire%29' d='M70 214 C40 180 44 140 64 112 C62 132 70 142 78 146 C72 116 84 84 108 64 C104 88 112 100 122 106 C122 78 138 52 164 40 C154 66 160 84 172 96 C176 82 188 72 200 68 C192 88 198 108 196 128 C206 120 212 108 214 98 C226 132 220 176 190 214 Z'/%3E %3C%21-- hound head, facing left --%3E %3Cpath fill='%23120c14' d='M86 214 C82 190 86 170 96 156 L66 150 C54 148 44 140 42 130 C41 124 46 120 52 120 L92 118 C100 106 112 98 126 94 L136 70 L150 92 L160 66 L170 96 C188 106 198 126 198 150 C198 180 186 202 172 214 Z'/%3E %3C%21-- jaw line and fang --%3E %3Cpath fill='none' stroke='%233a2230' stroke-width='4' stroke-linecap='round' d='M52 128 C70 134 86 136 100 134'/%3E %3Cpath fill='%23f4e9da' d='M66 133 L72 133 L69 144 Z'/%3E %3Cpath fill='%23f4e9da' d='M84 135 L90 135 L87 145 Z'/%3E %3C%21-- nose --%3E %3Cellipse cx='46' cy='124' rx='6' ry='5' fill='%232b1a24'/%3E %3C%21-- ember eye --%3E %3Cpath fill='%23ffcf3a' d='M118 116 L142 110 L136 122 Z'/%3E %3Ccircle cx='134' cy='115' r='3' fill='%23fff6c8'/%3E %3C/svg%3E">
<style>
  :root { --bg:#14121a; --card:#1e1b27; --line:#2f2a3d; --text:#ece8f4; --dim:#a39cb5; --ok:#5fd39a; --warn:#f0c062; --bad:#f07a7a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:15px; margin:0 0 10px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  main { padding:20px 24px; display:grid; gap:20px; max-width:1100px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .dim { color:var(--dim); font-size:13px; }
  .row { display:flex; gap:10px; padding:7px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .row b { min-width:190px; }
  .pill { font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid currentColor; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .bot { margin-top:12px; } .bot:first-child { margin-top:0; }
  .seat { margin:6px 0 0 16px; font-size:14px; }
  .seat .dim { margin-left:6px; }
  button { font:inherit; font-size:13px; color:var(--text); background:#2b2638; border:1px solid var(--line); border-radius:6px; padding:2px 10px; cursor:pointer; margin-left:8px; }
  button:hover { border-color:var(--dim); }
  select { font:inherit; color:var(--text); background:#2b2638; border:1px solid var(--line); border-radius:6px; padding:3px 8px; }
  .watch { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  #map { background:#0d0c12; border:1px solid var(--line); border-radius:8px; width:460px; max-width:100%; }
  #info { flex:1; min-width:260px; font-size:14px; }
  .hand { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .card-s { border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:13px; background:#25212f; }
  .card-s.no { opacity:.45; } .card-s.pick { outline:2px solid var(--warn); }
  .bar { height:6px; background:#2f2a3d; border-radius:3px; overflow:hidden; margin:2px 0 6px; }
  .bar i { display:block; height:100%; background:var(--ok); }
  #said { position:sticky; top:0; background:#2b2638; border-bottom:1px solid var(--line); padding:8px 24px; display:none; }
</style>
</head>
<body>
<header>
  <h1 style="display:flex;align-items:center;gap:10px"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E %3Cdefs%3E %3ClinearGradient id='bg' x1='0' y1='0' x2='0' y2='1'%3E %3Cstop offset='0' stop-color='%232a1420'/%3E%3Cstop offset='1' stop-color='%230e0a12'/%3E %3C/linearGradient%3E %3ClinearGradient id='fire' x1='0' y1='1' x2='0' y2='0'%3E %3Cstop offset='0' stop-color='%23ff3d1f'/%3E%3Cstop offset='.55' stop-color='%23ff8a1f'/%3E%3Cstop offset='1' stop-color='%23ffd54a'/%3E %3C/linearGradient%3E %3CradialGradient id='glow' cx='.5' cy='.55' r='.5'%3E %3Cstop offset='0' stop-color='%23ff5a1f' stop-opacity='.45'/%3E%3Cstop offset='1' stop-color='%23ff5a1f' stop-opacity='0'/%3E %3C/radialGradient%3E %3C/defs%3E %3Crect x='8' y='8' width='240' height='240' rx='52' fill='url%28%23bg%29'/%3E %3Ccircle cx='128' cy='140' r='110' fill='url%28%23glow%29'/%3E %3C%21-- flame mane behind the head --%3E %3Cpath fill='url%28%23fire%29' d='M70 214 C40 180 44 140 64 112 C62 132 70 142 78 146 C72 116 84 84 108 64 C104 88 112 100 122 106 C122 78 138 52 164 40 C154 66 160 84 172 96 C176 82 188 72 200 68 C192 88 198 108 196 128 C206 120 212 108 214 98 C226 132 220 176 190 214 Z'/%3E %3C%21-- hound head, facing left --%3E %3Cpath fill='%23120c14' d='M86 214 C82 190 86 170 96 156 L66 150 C54 148 44 140 42 130 C41 124 46 120 52 120 L92 118 C100 106 112 98 126 94 L136 70 L150 92 L160 66 L170 96 C188 106 198 126 198 150 C198 180 186 202 172 214 Z'/%3E %3C%21-- jaw line and fang --%3E %3Cpath fill='none' stroke='%233a2230' stroke-width='4' stroke-linecap='round' d='M52 128 C70 134 86 136 100 134'/%3E %3Cpath fill='%23f4e9da' d='M66 133 L72 133 L69 144 Z'/%3E %3Cpath fill='%23f4e9da' d='M84 135 L90 135 L87 145 Z'/%3E %3C%21-- nose --%3E %3Cellipse cx='46' cy='124' rx='6' ry='5' fill='%232b1a24'/%3E %3C%21-- ember eye --%3E %3Cpath fill='%23ffcf3a' d='M118 116 L142 110 L136 122 Z'/%3E %3Ccircle cx='134' cy='115' r='3' fill='%23fff6c8'/%3E %3C/svg%3E" width="30" height="30" alt="">Hellhound</h1>
  <span id="server" class="dim">Reading...</span>
</header>
<div id="said"></div>
<main>
  <section class="card"><h2>Can the bots play?</h2><div id="locks"></div></section>
  <section class="card"><h2>Bots</h2><div id="bots"></div></section>
  <section class="card"><h2>Watch</h2>
    <div class="row" style="border:0;align-items:center;flex-wrap:wrap">
      <select id="who" onchange="watchNow()"><option value="">Waiting for the server...</option></select>
      <span id="watchSaid" class="dim"></span>
    </div>
    <div class="watch">
      <canvas id="map" width="460" height="460"></canvas>
      <div id="info"></div>
    </div>
  </section>
  <section class="card"><h2>Bot updates</h2><div id="updates"></div></section>
  <p class="dim">Hellhound is the bots' own app. Ahziael's bot pages still work while they are retired step by step.</p>
</main>
<script>
async function act(path) {
  let text;
  try {
    const r = await fetch(path, { method: "POST", headers: { "X-Hellhound": "1" } });
    text = await r.text();
  } catch { text = "Lost the app: is its window still open?"; }
  const said = document.getElementById("said");
  said.textContent = text; said.style.display = "block";
  refresh();
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const row = (name, html) => `<div class="row"><b>${esc(name)}</b><span>${html}</span></div>`;
function lockClass(text) {
  if (/bots OFF/.test(text)) return "bad";
  if (/may play/.test(text)) return "ok";
  if (/LOCKED|NOT heard|NOT VALID|invalid|missing/i.test(text)) return "bad";
  if (/OK|heard|home/i.test(text)) return "ok";
  return "warn";
}
async function refresh() {
  let s;
  try { s = await (await fetch("/api/status", { cache: "no-store" })).json(); }
  catch { document.getElementById("server").textContent = "Lost the app: is its window still open?"; return; }
  document.getElementById("server").innerHTML =
    (s.folderFound ? "" : `<span class="bad">No server folder at ${esc(s.folder)}</span> · `) +
    `Server <span class="pill ${s.serverRunning ? "ok" : "warn"}">${s.serverRunning ? "running" : "not running"}</span>` +
    ` · read ${esc(s.readAt)}`;
  const k = s.killswitch;
  document.getElementById("locks").innerHTML =
    row("Kill switch (signed file now)", `<span class="${k.stop ? "bad" : "ok"}">${
      k.stop ? "Bots OFF" : "Bots may play"}</span> <span class="dim">${esc(k.text)}</span>`) +
    s.locks.map(l =>
    row(l.name, `<span class="${l.written ? lockClass(l.text) : "dim"}">${esc(l.text)}</span>`)).join("");
  document.getElementById("bots").innerHTML = s.bots.map(b => {
    const on = `<span class="pill ${b.on === "on" ? "ok" : "dim"}">${esc(b.on)}</span>` + (b.count ? ` <span class="dim">${esc(b.count)} play at once</span>` : "") +
      `<button onclick="act('/api/switch?bot=${encodeURIComponent(b.section)}&on=${b.on === "on" ? "false" : "true"}')">${b.on === "on" ? "Turn off" : "Turn on"}</button>`;
    const seats = b.seats.map(seat => {
      const members = seat.members.map(m => `${esc(m.name)}: ${esc(m.state)}${m.zone ? " in " + esc(m.zone) : ""}`).join("; ");
      return `<div class="seat">${esc(seat.name)}` +
        (seat.paused ? ` <span class="pill warn">paused: ${esc(seat.paused)}</span>` : "") +
        (seat.quest ? `<span class="dim">quest: ${esc(seat.quest)}</span>` : "") +
        (seat.doing ? `<span class="dim">${esc(seat.doing)}</span>` : "") +
        (seat.note ? ` <span class="pill warn">${esc(seat.note)}</span>` : "") +
        (members ? `<span class="dim">${members}</span>` : "") +
        (seat.at ? `<span class="dim">(as of ${esc(seat.at)})</span>` : "") +
        `<button onclick="act('/api/pause?seat=${encodeURIComponent(seat.id)}')">${seat.paused ? "Resume" : "Pause"}</button></div>`;
    }).join("");
    return `<div class="bot"><b>${esc(b.name)}</b> ${on}${seats}</div>`;
  }).join("");
  const u = s.updates;
  document.getElementById("updates").innerHTML =
    row("Running", esc(u.running || "the server hasn't said yet")) +
    row("Wanted", esc(u.wanted)) +
    row("Updates by themselves", esc(u.liveUpdates)) +
    row("Last looked", esc(u.lastCheck ? `${u.lastCheck} ${u.lastCheckResult}` : "not yet")) +
    (u.problem ? row("Problem", `<span class="bad">${esc(u.problem)}</span>`) : "") +
    row("", `<button onclick="act('/api/check-updates')">Look for a bot update now</button>`);
}
refresh();
setInterval(refresh, 5000);

// ---- Watch: the wizard's own minimap and, in a battle, its hand (the overlay's Spectate Anyone feed) ----
const SCHOOL = { Fire:"#f26b3a", Ice:"#7cc7ff", Storm:"#b884ff", Myth:"#f2d14b", Life:"#6fdc7a", Death:"#a7a7b8", Balance:"#e0a75e",
                 Sun:"#ffd66b", Moon:"#c9b6ff", Star:"#9fd6ff", Shadow:"#8b6fbf" };
const GROUND = { 9:"#2a2a33", 3:"#1f4a73", 2:"#2f5b34", 1:"#7a6a52", 7:"#2f5b34", 6:"#7a6a52", 8:"#7b5a3a", 4:"#c9c3d6" };
const grounds = {};
let watching = "", lastGround = "", busy = false;
function readGround(g) {
  const out = { tri:{}, lines:{}, rounds:[] };
  if (!g || !g.shapes) return out;
  const bin = atob(g.shapes), data = new DataView(new Uint8Array([...bin].map(c => c.charCodeAt(0))).buffer);
  const L = g.left, B = g.bottom, U = g.unit, X = i => L + data.getUint16(i, true) * U, Y = i => B + data.getUint16(i, true) * U;
  let at = 0;
  while (at + 5 <= data.byteLength) {
    const kind = data.getUint8(at), count = Math.min(data.getUint32(at + 1, true), 2000000); at += 5;
    if (kind >= 17 && kind <= 25 && kind !== 21) {
      for (let n = 0; n < count && at + 2 <= data.byteLength; n++) {
        const pts = data.getUint16(at, true); at += 2;
        if (at + pts * 4 > data.byteLength) { at = data.byteLength; break; }
        const line = []; for (let p = 0; p < pts; p++, at += 4) line.push(X(at), Y(at + 2));
        if (pts >= 3) (out.lines[kind - 16] ??= []).push(line);
      }
      continue;
    }
    const each = kind === 5 ? 6 : 12;
    if (kind < 1 || kind > 9 || at + count * each > data.byteLength) break;
    for (let n = 0; n < count; n++, at += each) {
      if (kind === 5) out.rounds.push(X(at), Y(at + 2), data.getUint16(at + 4, true) * U);
      else { const t = (out.tri[kind] ??= []); for (let p = 0; p < 3; p++) t.push(X(at + p * 4), Y(at + p * 4 + 2)); }
    }
  }
  return out;
}
function drawMap(map) {
  const c = document.getElementById("map"), g = c.getContext("2d"), W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  if (!map) return;
  const range = Math.max(map.range || 1500, 300), k = (W / 2) / range;
  const sx = x => W / 2 + (x - map.x) * k, sy = y => H / 2 - (y - map.y) * k;
  const ground = grounds[lastGround];
  if (ground) {
    for (const kind of [9, 3, 2, 1, 7, 6, 8, 4]) {
      g.fillStyle = GROUND[kind];
      const t = ground.tri[kind] || [];
      g.beginPath();
      for (let i = 0; i < t.length; i += 6) { g.moveTo(sx(t[i]), sy(t[i+1])); g.lineTo(sx(t[i+2]), sy(t[i+3])); g.lineTo(sx(t[i+4]), sy(t[i+5])); g.closePath(); }
      g.fill();
      for (const line of ground.lines[kind] || []) {
        g.beginPath(); g.moveTo(sx(line[0]), sy(line[1]));
        for (let i = 2; i < line.length; i += 2) g.lineTo(sx(line[i]), sy(line[i+1]));
        g.closePath(); g.fill();
      }
    }
    g.fillStyle = "#c9c3d6";
    for (let i = 0; i < ground.rounds.length; i += 3) { g.beginPath(); g.arc(sx(ground.rounds[i]), sy(ground.rounds[i+1]), Math.max(1, ground.rounds[i+2] * k), 0, 7); g.fill(); }
  }
  const color = { npc:"#f2d14b", door:"#7cc7ff", sigil:"#b884ff", mob:"#f07a7a", boss:"#ff4d4d", chest:"#e0a75e", battle:"#ff8c3a",
                  "wisp-health":"#ff6b8b", "wisp-mana":"#6bb6ff", wizard:"#ffffff", team:"#5fd39a" };
  g.font = "11px system-ui";
  for (const m of map.marks || []) {
    const x = sx(m.x), y = sy(m.y);
    if (x < -10 || y < -10 || x > W + 10 || y > H + 10) continue;
    g.fillStyle = color[m.k] || "#a39cb5";
    g.beginPath(); g.arc(x, y, m.k === "boss" || m.k === "battle" ? 5 : 3, 0, 7); g.fill();
    if (m.n && ["team", "wizard", "boss", "sigil", "door"].includes(m.k)) { g.fillText(m.n, x + 6, y - 4); }
  }
  // The wizard: an arrow pointing where it faces.
  const yaw = map.yaw || 0;
  g.save(); g.translate(W / 2, H / 2); g.rotate(Math.PI + yaw);
  g.fillStyle = "#ff8c3a"; g.strokeStyle = "#000"; g.beginPath(); g.moveTo(0, -9); g.lineTo(6, 7); g.lineTo(0, 3); g.lineTo(-6, 7); g.closePath(); g.fill(); g.stroke();
  g.restore();
}
function bar(hp, max) { const p = max > 0 ? Math.max(0, Math.min(100, hp * 100 / max)) : 0; return `<div class="bar"><i style="width:${p}%;background:${p < 30 ? "var(--bad)" : p < 60 ? "var(--warn)" : "var(--ok)"}"></i></div>`; }
function drawInfo(u) {
  if (!u) { document.getElementById("info").innerHTML = ""; return; }
  let html = `<b>${esc(u.name)}</b> <span class="dim">level ${esc(u.level)}${u.school ? " · " + esc(u.school) : ""}</span>` +
    `<div class="dim">${esc(u.hp)} / ${esc(u.max)} health</div>${bar(u.hp, u.max)}` +
    `<div>${esc(u.place || "")}${u.world ? ` <span class="dim">(${esc(u.world)})</span>` : ""}</div>` +
    (u.doing ? `<div class="dim">${esc(u.doing)}</div>` : "") +
    (u.questTitle ? `<div style="margin-top:6px">Quest: <b>${esc(u.questTitle)}</b></div>` : "") +
    (u.step ? `<div class="dim">${esc(u.step)}</div>` : "");
  const b = u.battle;
  if (b && b.hand) {
    html += `<h2 style="margin-top:14px">Battle · round ${esc(b.round)}</h2>` +
      `<div class="dim">${esc(b.hp)} / ${esc(b.max)} health · pips ${esc(b.pips)} · power ${esc(b.power)}${b.shadow ? " · shadow " + esc(b.shadow) : ""}</div>` +
      `<div class="hand">${b.hand.map(c => `<span class="card-s${c.ok ? "" : " no"}${c.pick ? " pick" : ""}" style="border-color:${SCHOOL[c.s] || "var(--line)"}">${esc(c.n)} <span class="dim">${esc(c.r)}</span></span>`).join("") || '<span class="dim">no hand yet</span>'}</div>` +
      (b.pick ? `<div>Picks: <b>${esc(b.pick)}</b></div>` : "") + (b.why ? `<div class="dim">${esc(b.why)}</div>` : "") +
      (b.discards && b.discards.length ? `<div class="dim">Threw away: ${b.discards.map(esc).join(", ")}</div>` : "") +
      ((b.enemies || []).length ? `<div style="margin-top:8px"><b>Foes</b>${b.enemies.map(e => `<div class="dim">${esc(e.n)} ${esc(e.hp)} / ${esc(e.max)}</div>${bar(e.hp, e.max)}`).join("")}</div>` : "") +
      ((b.allies || []).length ? `<div><b>Allies</b>${b.allies.map(e => `<div class="dim">${esc(e.n)} ${esc(e.hp)} / ${esc(e.max)}</div>`).join("")}</div>` : "") +
      ((b.casts || []).length ? `<div style="margin-top:8px"><b>Casts</b>${b.casts.slice(0, 6).map(c => `<div class="dim">${esc(c)}</div>`).join("")}</div>` : "");
  }
  document.getElementById("info").innerHTML = html;
}
async function watchNow() {
  if (busy) return;
  busy = true;
  try {
    const pick = document.getElementById("who").value;
    if (pick !== watching) { watching = pick; }
    const a = await (await fetch(`/api/watch?who=${encodeURIComponent(watching)}&ground=${encodeURIComponent(lastGround)}`, { cache: "no-store" })).json();
    const said = document.getElementById("watchSaid");
    if (a.everyone) {
      const sel = document.getElementById("who"), now = a.watching || "";
      const opts = a.everyone.map(e => `<option value="${esc(e.id)}"${e.id === now ? " selected" : ""}>${esc(e.name)} (${esc(e.kind === "Player" ? e.school : e.kind)})</option>`).join("");
      if (sel.dataset.opts !== opts) { sel.innerHTML = opts; sel.dataset.opts = opts; }
      if (!watching) watching = now;
    }
    if (!a.ok) { if (a.error !== "busy") said.textContent = a.error || ""; return; }
    said.textContent = "";
    const map = a.map;
    if (map && map.ground) { grounds[map.ground.key] = readGround(map.ground); lastGround = map.ground.key; }
    drawMap(map); drawInfo(a.ultimus);
  } catch { document.getElementById("watchSaid").textContent = "Lost the app: is its window still open?"; }
  finally { busy = false; }
}
watchNow();
setInterval(watchNow, 1500);
</script>
</body>
</html>
