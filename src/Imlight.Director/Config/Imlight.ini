[Minigames]
; A finished minigame score above this multiple of the game's top score threshold is rejected. Empty or 0 disables the cap.
ScoreCapMultiplier =

[Seamstress]
; Crowns charged for one stitch and one unstitch. Both must be set (0 or more), or the seamstress options are not offered.
StitchCrowns = 0
UnstitchCrowns = 0
; Locale key shown as the title of the stitch windows.
