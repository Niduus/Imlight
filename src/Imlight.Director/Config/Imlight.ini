[Global Settings]
GameRevision = r806919.Wizard_1_610
; If true, the servers will refuse connections if the game revision does not match.
EnforceRevision = false

[Logging]
LogPath = ./logs/log.txt
; The minimum log level to be written to the log file. Valid values are: TRACE, DEBUG, INFO, WARN, ERROR, FATAL
LogLevel = DEBUG
LogFormat = {Timestamp:yyyy-MM-dd HH:mm:ss.fff} {Level:u3} {CallingSpace} : {Message:lj} {NewLine}{Exception}
SeqSinkUrl = http://localhost:5341

[Locale]
Language = en-US

[Login Server]
; The internal name for the login server. This is not a realm name.
LoginServerName = Imlight.Login
LoginServerPort = 12000
LoginPlayerLimit = 1000
MaxAllowedCharactersPerAccount = 6
; The time in seconds that a user can be AFK before being disconnected.
LoginAfkTimeout = 360
; The time in seconds between AFK checks.
LoginAfkCheckInterval = 60
; If true, nobody is ever disconnected for being idle (LoginAfkTimeout is ignored).
DisableIdleKick = true

[Game Server]
; The internal name for the game server. This is not a realm name.
GameServerName = Imlight.Game
GameServerPort = 12333
GameServerPlayerLimit = 1000
; Leave this at 127.0.0.1: each player is then sent the address they can reach (this computer, your home
; network, a VPN or the internet). Any other address here is sent to everyone not on this computer.
GameServerIP = 127.0.0.1
; The address friends on the internet use to reach this computer (your public IP or a web address).
; Empty finds it by itself.
PublicAddress =
; The number of game servers (realms) the Director will create.
GameServerCount = 3
; The number of game servers that can be created.
MaxGameServersAllowed = 3
; Comma-separated list of realm names. Must have at least GameServerCount entries.
RealmNames = Centaur,Pegasus,Phoenix
; The time in seconds that a session key is valid.
SessionKeyValidityTime = 28800
; The time in seconds that a trade invite waits for the other player before it counts as declined.
TradeInviteTimeoutSeconds = 60

[Combat]
; The current health percent a creature must to decide healing itself on a prepare turn.
HealingThreshhold = 0.75
; The percent chance a creature will heal itself on a prepare turn.
HealingPercentChance = 0.5
; The percent chance a creature will pass on a prepare turn.
PreparePassChance = 0.33
; The amount of aggro increase a player will receive upon damaging a creature.
DamagedAggroIncrease = 5
; The amount of aggro increase a player will receive upon healing a teammate.
HealingAggroIncrease = 3
; The amount of aggro increase a player will receive upon using the 'Provoke' spell on a creature.
ProvokeAggroIncrease = 20
; The amount of aggro decrease a player will receive upon using the 'Pacify' spell on a creature.
PacifyAggroDecrease = 50

[PvP]
; If false, the PvP kiosks answer that PvP is temporarily disabled and nobody can queue.
Enabled = true
; If false, the ranked queue is closed and ranked matches are not offered; practice matches still work.
RankedEnabled = true
; Seconds a team has to plan on its half of a round in a practice duel.
Practice.PlanningSeconds = 20

[Character]
StartingLevel = 1
; If true, new characters skip the tutorial and start in StartingZone.
TutorialDisabled = false
; Starter kit template IDs, comma-separated. Granted in the tutorial, or on first login when TutorialDisabled.
; Do not exceed 16 items: RavenDB has a batch limit of 16.
DefaultItems = 1317127,1317128,1317125,1317124,1317126,1317129,1317130,1317131,1317132,1317133,1317234,87256,284071,126983
StartingZone = WizardCity/Interiors/WC_Headmistress_House
StartingWorld = 1
BaseGoldPouch = 1000000
BaseLunariPouch = 1000000
MaxLevel = 200
MaxInventoryItems = 75
MaxJewelsAllowed = 100
MaxFriends = 100
PetEnergyTickInSeconds = 450
MaxActiveElixirs = 3
MaxEmotesAllowed = 100
MaxTeleportsAllowed = 100
HidePetWhileMounted = false
; Every wizard has at least this many potion bottles (0 to 20). New bottles come full, and potion vendors
; (like Hilda Brewer in the Commons) refill them for gold. 0 turns it off.
StartingPotions = 1
; Crowns every wizard starts with.
StartingCrowns = 100000000
; If true, crowns go back up to StartingCrowns every time the wizard logs in or changes area.
RefillCrowns = true
; If true, the game treats every wizard as a member with every member benefit.
MemberBenefits = true
; Default capacity of a character's bank and of an account's shared bank, in items. Both must be set above 0, or banking stays off.
MaxBankItems = 100
MaxSharedBankItems = 100

[Pets]
; The happiness a newly hatched pet starts with.
StartingHappiness = 50
; The ceiling on a pet's own maximum stats before talents and jewels (a Mighty jewel adds 65 to Strength while it is in).
; A pet's own maximum comes from its kind in the game files, or from its parents when hatched; this only caps it.
; 0 means no ceiling.
MaxStrength = 260
MaxIntellect = 260
MaxAgility = 260
MaxWill = 260
MaxPower = 260
; The most happiness a pet can have.
MaxHappiness = 1000
; true: a new pet (bought, dropped, given or hatched) gets the maximums above and starts with every stat at them.
; false (like the real game): a new pet gets its kind's or its parents' maximum and starts at its kind's starting
; stats; pet games and snacks train them up. Pets you already have keep their stats either way.
StartAtMaxStats = false
; The factor on the XP a pet earns from games and snacks. Every wizard counts as a member.
MemberXpMultiplier = 2
; Pet experience from a snack is the stat numbers on its card added up (+15, +15 and +25 make 55).
; A pet needs 125 XP for Teen and 2,125 for Mega. Also see the .pet commands.
; Double XP & Rewards: true counts snack experience twice (55 becomes 110).
DoubleSnackXp = true
; Extra experience for a snack the pet likes, as a multiplier (1 is none, 1.5 is half again).
LikedSnackBonus = 1
; Double XP & Rewards also doubles the stats a snack gives (+15 becomes +30). Needs DoubleSnackXp.
DoubleSnackStats = true
; true (like the real game): experience past a new age counts toward the next age (244/250 + 110 starts the new age at 104).
; false: the extra experience is lost and the pet starts the new age at 0.
KeepExtraXp = true
; true: XP is a running total that is not reset at a new age, so the 125 XP that made a pet Teen counts toward the 250 for Adult.
; false (like the real game): each age starts over.
RunningTotalXp = false
; After skipping a pet game, show the end of game window so you can feed a snack from it.
; Set to false if that window causes trouble.
SkipShowsFeedWindow = true
; true: a skipped pet game gives the game's XP and the stats of one of its tracks, like winning it.
; false: skipping gives nothing; only the snack fed after it counts.
SkipGameRewards = false
; Backpack "Feed to pet": the pet eats the item and you get gold (5% of its value) and a reward by its value.
; true: items cost pet energy where the game files say so (no item does today). false: feeding is always free.
ItemFeedCostsEnergy = true
; The pet energy one item feed costs when it costs energy.
ItemFeedEnergyCost = 1

[Hatching]
; Hatching two pets into an egg: .hatch <pet 1> <pet 2>, the hatchmaking kiosk, or right-click a player and pick Hatch.
; false turns hatching off.
Enabled = true
; Minutes until a new egg hatches. 1 is quick for testing; -1 uses each pet's own hatch time from the game files (hours).
HatchMinutes = 1
; Gold taken from each player who gets an egg. 0 is free.
GoldCost = 0
; The age both parents need: 1 Baby (any hatched pet), 2 Teen, 3 Adult, 4 Ancient, 5 Epic, 6 Mega, 7 Ultra.
MinParentLevel = 1
; Hatching with another player: the "ready" value both players must reach before the eggs are made.
; 1 when the window has one Hatch button; 2 if it asks to confirm like the trade window does.
ReadyToHatch = 1
; The hatching sigils in the Pet Pavilion hatchery send you (or both players on a duo sigil) to the pet morphing room
; (ThePhantomZoneWorld/PetGameMorph), where the game's hatch window is, and back afterwards. Your pets are also listed in
; chat for .hatch. false: no teleport, chat list only (and the in-person hatch request on a duo sigil).
SigilWindow = true
; "Lends Available Today" in the hatching room. Lend Pet: your partner hatches with your pet and you get no egg.
; The game can show 255 at most; 0 turns Lend Pet off.
LendsPerDay = 999
; Minutes a player may stay in the pet morphing room before being sent back to the hatchery.
MorphZoneMinutes = 5

[Jewels]
; Taking a jewel out of a socket shatters it (it is gone), like the real game; No Shatter jewels come back.
; true: every jewel taken out goes back to your backpack instead.
KeepShatteredJewels = false

[PetCasting]
; Pet May Cast talents (such as Guardian Wall: Maycast Tower Shield). The pet casts the game's pet copy of the card, free, on its owner
; (a spell that hits enemies goes at an enemy). It can go off when you or a teammate casts a spell, takes damage, or heals.
; false: pets never May Cast.
Enabled = true
; Chance in percent (0 to 100) that a May Cast goes off when you or a teammate casts a spell.
OnCast = 10
; Chance in percent that a May Cast goes off when you or a teammate takes damage.
OnDamage = 10
; Chance in percent that a May Cast goes off when you or a teammate is healed.
OnHeal = 10
; Chance in percent that a May Cast goes off when you or a teammate passes.
OnPass = 10
; The most May Casts one pet can do in a round.
MaxPerRound = 1
; true: a May Cast can set off more May Casts (your pet's own or a teammate's pet's), like any other cast.
; A pet chaining off itself needs MaxPerRound above 1.
Chain = true
; The most May Casts in a row one spell can set off.
MaxChain = 10
; The most seconds the next turn waits for each May Cast to play, with [Battle] FastAnimationTiming = false only
; (with it on, each May Cast waits its measured animation). Raise it if turns start before the casts finish.
CastSeconds = 4
; true: May Casts cost no pips, also on your screen (the game would take the card's pips and still cast at 0).
ZeroCost = true
; Test switch. true: the cast is flagged as the pet's (to try for the pet's own casting look).
; false: the cast shows as yours.
ShowAsPetCastTest = false
; Test switch. true: the cast is sent as an item card. The game skipped it then ("not in hand"), so it is off.
AsItemCard = false
; Test switch. true: the cast is sent as forced. The game skipped it then too, so it is off.
ForceSpellTest = false
