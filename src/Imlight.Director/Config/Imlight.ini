[Global Settings]
GameRevision = r803238.Wizard_1_610
; If true, the servers will refuse connections if the game revision does not match.
EnforceRevision = false

[Logging]
LogPath = ./logs/log.txt
; The minimum log level to be written to the log file. Valid values are: TRACE, DEBUG, INFO, WARN, ERROR, FATAL
LogLevel = DEBUG
LogFormat = {Timestamp:yyyy-MM-dd HH:mm:ss.fff} {Level:u3} {CallingSpace} : {Message:lj} {NewLine}{Exception}
SeqSinkUrl = http://localhost:5341

[Locale]
Language = en-US

[Login Server]
; The internal name for the login server. This is not a realm name.
LoginServerName = Imlight.Login
LoginServerPort = 12000
LoginPlayerLimit = 1000
MaxAllowedCharactersPerAccount = 6
; The time in seconds that a user can be AFK before being disconnected.
LoginAfkTimeout = 360
; The time in seconds between AFK checks.
LoginAfkCheckInterval = 60
; If true, nobody is ever disconnected for being idle (LoginAfkTimeout is ignored).
DisableIdleKick = true

[Game Server]
; The internal name for the game server. This is not a realm name.
GameServerName = Imlight.Game
GameServerPort = 12333
GameServerPlayerLimit = 1000
GameServerIP = 127.0.0.1
; The number of game servers (realms) the Director will create.
GameServerCount = 3
; The number of game servers that can be created.
MaxGameServersAllowed = 3
; Comma-separated list of realm names. Must have at least GameServerCount entries.
RealmNames = Centaur,Pegasus,Phoenix
; The time in seconds that a session key is valid.
SessionKeyValidityTime = 28800

[Combat]
; The current health percent a creature must to decide healing itself on a prepare turn.
HealingThreshhold = 0.75
; The percent chance a creature will heal itself on a prepare turn.
HealingPercentChance = 0.5
; The percent chance a creature will pass on a prepare turn.
PreparePassChance = 0.33
; The amount of aggro increase a player will receive upon damaging a creature.
DamagedAggroIncrease = 5
; The amount of aggro increase a player will receive upon healing a teammate.
HealingAggroIncrease = 3
; The amount of aggro increase a player will receive upon using the 'Provoke' spell on a creature.
ProvokeAggroIncrease = 20
; The amount of aggro decrease a player will receive upon using the 'Pacify' spell on a creature.
PacifyAggroDecrease = 50

[Character]
StartingLevel = 1
; If true, new characters skip the tutorial and start in StartingZone.
TutorialDisabled = false
; Starter kit template IDs, comma-separated. Granted in the tutorial, or on first login when TutorialDisabled.
; Do not exceed 16 items: RavenDB has a batch limit of 16.
DefaultItems = 1317127,1317128,1317125,1317124,1317126,1317129,1317130,1317131,1317132,1317133,1317234,87256,284071,126983
StartingZone = WizardCity/Interiors/WC_Headmistress_House
StartingWorld = 1
BaseGoldPouch = 1000000
MaxLevel = 200
MaxInventoryItems = 75
MaxJewelsAllowed = 100
MaxFriends = 100
PetEnergyTickInSeconds = 450
HidePetWhileMounted = false
; Every wizard has at least this many potion bottles (0 to 20). New bottles come full, and potion vendors
; (like Hilda Brewer in the Commons) refill them for gold. 0 turns it off.
StartingPotions = 1
; Crowns every wizard starts with.
StartingCrowns = 100000000
; If true, crowns go back up to StartingCrowns every time the wizard logs in or changes area.
RefillCrowns = true
; If true, the game treats every wizard as a member with every member benefit.
MemberBenefits = true

[Patch Server]
; The internal name for the patch server. This is not a realm name.
PatchServerName = Imlight.Patch
; The port used by the patch server.
PatchServerPort = 12500
; The URL to the patch server.
PatchServerInternalUrl = http://127.0.0.1:12369
; The time in seconds that the patch server will wait to reach the endpoint before timing out.
PatchServerInternalTimeout = 10
; The time in seconds that any given download will wait before timing out.
PatchServerDownloadTimeout = 360
LocalWadCachePath = ./cache

[ID Lookup]
; If true, the server writes a searchable list of every item, spell, creature and NPC ID on boot,
; and the in-game .lookup commands can search it. It is built once per GameRevision, in the background.
BuildOnBoot = true
; The folder for the list. Open index.html in a browser to search it, or ids.csv in a spreadsheet.
OutputPath = ./id-lookup

[Randomizer]
; Randomizer mode. If true, the switches below shuffle the game for every character on this server.
; Swaps stay balanced: spells keep their type and pip cost, gear keeps its slot, school and level range,
; treasure cards keep their type and pip cost, and creatures keep their level range.
Enabled = false
; New characters get a random school instead of the one they picked.
RandomizeSchool = true
; Spells from trainers, quests and drops are swapped. Trainers show the swapped spell.
RandomizeSpells = true
; Gear and treasure cards from drops and quest rewards are swapped.
RandomizeDrops = true
; Creatures in the world are swapped for others of a similar level (bosses only swap with bosses).
; Off by default: quests that ask you to defeat a specific creature may become impossible.
RandomizeCreatures = false
; If true, every spawn rolls a new creature. If false, each creature always swaps to the same one.
CreaturesChangeEverySpawn = true
; Every creature's deck is rolled fresh each spawn: each spell becomes a random spell of the same type and pip cost.
RandomizeCreatureDecks = true
; Cards your gear gives are rolled fresh every battle, the same way.
RandomizeItemCards = true
; Each round gives a random number of pips: usually 1, sometimes 0, 2 or 3, but never 0 when you have none. Applies to creatures too.
RandomizePips = true
; New characters start with this many random spells of up to 3 pips, from any school, already in their starter deck. 0 turns it off.
StartingSpells = 6
; The chance, from 0 to 100, that winning a battle teaches a random spell. Any battle spell in the game
; can come up, including ones players normally never get. 0 turns it off.
SpellAfterBattleChance = 100
; Any text. Changing it reshuffles everything for everyone, so set it before characters are made.
Seed = imlight
; If true, every character gets the same shuffle, for races. If false, each character's shuffle is their own.
SameForEveryone = false
; Each wizard's shadow pip limit is rolled from 1 to 5, and each creature gets shadow magic by chance.
; Needs ShadowPips on in [Battle].
RandomizeShadowPips = false
; How many levels wide each gear and creature level range is.
LevelRange = 10

[Trainers]
; These work with or without randomizer mode.
; Each spell that needs another spell first needs a different, random one instead, picked from the same
; trainer's lower level spells, so every spell can still be reached.
RandomizeSpellRequirements = false
; No spell needs another spell first. Overrides RandomizeSpellRequirements.
NoSpellRequirements = false
; Any level can train any spell.
NoLevelRequirements = false
; Training spells costs no training points, even from other schools.
FreeTraining = false
; Every level gained also gives training points. How many is set just below.
TrainingPointPerLevel = false
; How many training points each level gives when TrainingPointPerLevel is on (0 to 100).
TrainingPointsPerLevel = 1
; Any player can type .gaintp <amount> (1 to 100) to give themselves training points.
PlayersCanGainTrainingPoints = true

[World]
; If true, every door and teleport works without the quest, level or event it normally needs (such as Nightside in the Commons).
OpenAllDoors = false

[Battle]
; If true, a spell that fizzles still costs its mana, the same as if it had worked.
ManaOnFizzle = false
; If true, spells never use up mana, and arriving in the Commons fills mana back to full.
UnlimitedMana = false
; If true, a won battle (not one everybody fled) drops a health, a mana and a gold wisp where it was fought.
; Nobody picking them up makes them vanish after 2 minutes.
BattleWisps = true
; If true, a power pip only half used on a spell (a 3 pip spell paid with 2 power pips) always gives
; the spare pip back as a normal pip, like having 100% pip conserve.
FullPipConserve = false
; If true, the Daybreaker and Nightbringer enchantments still add their damage but no longer add a pip to the card's cost.
NoPipsFromDaybreakerNightbringer = false
; If true, once every pip slot is full, each round turns one power pip into a school pip of your own school.
; School pips pay for the school pip cost some higher level spells have.
SchoolPips = true
; If true, a wizard's school pip gauge fills each round, and once full their next pip is a school pip.
; No stats needed.
GainSchoolPips = false
; How much the school pip gauge fills each round, from 0 to 100 (25 means a school pip every 4 rounds).
SchoolPipChance = 25
; If true, school pips come in a random school instead of your own.
RandomSchoolPips = false
; If true, wizards and creatures can get shadow pips, which shadow spells cost. They have their own slots,
; and wizards get shadow magic unlocked so the shadow slots and gauge show.
ShadowPips = true
; The most shadow pips a wizard can hold at once. 0 means no limit.
PlayerShadowPipLimit = 0
; The fewest shadow pips a wizard holds. If they have fewer, they top back up to this each round. 0 turns it off.
PlayerShadowPipMin = 0
; The most shadow pips a creature can hold at once. 0 means no limit.
CreatureShadowPipLimit = 0
; If true, creatures can get shadow pips too. If false, only wizards can.
CreatureShadowPips = true
; If true, each creature gets shadow magic only by chance, rolled every battle (see CreatureShadowMagicChance).
RandomCreatureShadowPips = false
; The chance, from 0 to 100, that a creature gets shadow magic when RandomCreatureShadowPips is on.
CreatureShadowMagicChance = 50
; How much the shadow gauge fills each round, from 0 to 100; a full gauge gives a shadow pip. 0 uses each
; wizard's or creature's own shadow pip rating from level and gear, which is 0 for low levels.
ShadowPipChance = 0
; If true, wizards get shadow pips even without the shadow pip rating stat (the gauge fills 25 each round,
; or ShadowPipChance if that is set).
NaturalShadowPips = false

[Bazaar]
; How many treasure cards Elik (the Bazaar) shows, spread over every school (most 1000). Sending too many
; at once makes the game lose its connection (all 5218 did), so raise this a little at a time.
TreasureCards = 500

[Die Delete]
; Die = Delete mode. If true, a character that dies in battle and is still dead when the battle ends is deleted for good.
; Fleeing does not count, and neither does the tutorial battle. The player is disconnected and told why.
Enabled = false

[April Fools]
RandomizeCreatures = false
RandomizeGateways = false
RandomBackflips = false

[Database]
PlayerDatabaseUrl =
PlayerDatabaseName = Playerdata
PlayerDatabaseCertificatePath = ../playerdb-dev-1yr.pfx
; The GitHub repository (owner/repo) containing the spiralDB world data.
SpiralDBRemoteUrl = https://github.com/Revive101/spiraldb.git
; The branch or tag to track within the repository.
SpiralDBBranch = main
; The local directory where the repository is cloned / cached.
SpiralDBLocalPath = ./spiraldb-cache
; If true, the repository is fetched on every boot to pull the latest data.
SpiralDBAutoFetch = true
; If true, the remote is never contacted — only local data is used.
SpiralDBDisableRemote = false
; The maximum time in seconds to wait for a git fetch to complete.
SpiralDBFetchTimeout = 30
; If true, keep the previous in-memory data when a fetch or parse fails.
SpiralDBRollbackOnFailure = true
AdminAccountUsername = admin
AdminAccountPassword = compsci
DatabaseMaxNumberOfRequestsPerSession = 16
DatabaseRequestTimeoutInSeconds = 90
DatabaseWaitForNonStaleResultsTimeout = 5
; The directory where the embedded database will be stored.
EmbeddedDatabaseDataDirectory = ../ImlightEmbeddedDatabase/
; The port used by the embedded database.
EmbeddedDatabasePort = 8080
; The time in seconds that the embedded database will wait to reach the endpoint before timing out.
EmbeddedDatabaseTimeoutTime = 90
; If true, a full RavenDb database will be used. The full database includes a dotnet runtime.
EmbeddedDatabaseUseFull = False
; The path to the full RavenDb. Only used if EmbeddedDatabaseUseFull is true.
EmbeddedDatabaseFullPath = ../RavenDB/Server/

[Advanced]
; Please only change these settings if you know what you are doing.
CharacterUploadIntervalInMinutes = 6
; The salt used to hash the session key.
SessionKeyHashInput = MAGIC_HATTER
PatchServerBufferSize = 4096
PatchServerUserAgent = Imlight Patcher
; The size of the buffer used by the session actor.
SessionActorBufferSize = 4096
; The thread pool size used by the session actor to send messages.
SessionActorSendPoolSize = 3
; The thread pool size used by the session actor to receive messages.
SessionActorReceivePoolSize = 3
; If true, the session actor will close on exception.
SessionActorCloseOnException = True
; The number of times the session actor will restart a service before crashing.
SessionActorServiceRetryCount = 3
; The time in seconds that the session actor will wait before restarting.
SessionActorServiceRangeRetry = 30
; The time in seconds that the server will send a heartbeat to the client.
KeepAliveInterval = 60
; The time in seconds the server will wait for a heartbeat response.
KeepAliveRspWaitTime = 15
; How many requests are allowed within the token bucket of the session actor.
SessionTokenBucketMax = 150
; How many new tokens are added to the token bucket per second.
SessionTokenBucketPerSecond = 50
; How many times the session actor will try to acquire a token before failing.
SessionTokenBucketFailedAcquisitionLimit = 5
; The time in seconds that the local wad cache will wait for the patch server to respond.
LocalWadCacheWaitForPatchServerTimeout = 10
